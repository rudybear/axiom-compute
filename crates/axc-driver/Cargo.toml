[package]
name = "axc-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI driver for the AXIOM-Compute compiler (M2.4: MCP stdio server)"

[[bin]]
name = "axc"
path = "src/main.rs"

# M2.2 bench harness: compile, cpu_reference, dispatch, postprocess.
# Order matters (AT-708): compile FIRST, cpu_reference SECOND, dispatch THIRD,
# postprocess FOURTH — ensures compile runs before GPU dispatch warms caches.
[[bench]]
name = "compile"
path = "benches/compile.rs"
harness = false

[[bench]]
name = "cpu_reference"
path = "benches/cpu_reference.rs"
harness = false

[[bench]]
name = "dispatch"
path = "benches/dispatch.rs"
harness = false

[[bench]]
name = "postprocess"
path = "benches/postprocess.rs"
harness = false

# M2.6: Q4_K_M dequant+matvec dispatch bench.
# Isolated from dispatch.rs for per-bench-binary Criterion state independence.
[[bench]]
name = "dispatch_q4km"
path = "benches/dispatch_q4km.rs"
harness = false

# M3.1: GPU-resident benchmark (upload-once/dispatch-N/kernel-only timing).
# New bench IDs: dispatch_resident_matmul_tile, matmul_tflops_4096.
[[bench]]
name = "resident_matmul"
path = "benches/resident_matmul.rs"
harness = false

# M3.3b: honest effective-TFLOPS bench for matmul_shared_coopmat.axc (AT-1710).
# Bench ID: dispatch_resident_matmul_shared_coopmat
[[bench]]
name = "resident_matmul_competitive"
path = "benches/resident_matmul_competitive.rs"
harness = false

# M3.3c: honest effective-TFLOPS bench for matmul_rb_coopmat.axc (AT-1730).
# Bench ID: dispatch_resident_matmul_rb_coopmat (distinct from AT-1711 id).
[[bench]]
name = "resident_matmul_rb"
path = "benches/resident_matmul_rb.rs"
harness = false

# M3.10a: honest padded-vs-base TFLOPS bench for the BANK-PADDED plain-f32 RB coopmat matmul
# (AT-2406) + the PAD in {1,2,4,8} sweep (AT-2410). >= 1.15x gate vs the unpadded base at 768^3,
# printed + checked, never asserted-loose; armed honest-negative with shared-bytes/occupancy
# diagnosis. Bench ID: dispatch_resident_matmul_rb_pad. GPU-gated.
[[bench]]
name = "resident_matmul_rb_pad"
path = "benches/resident_matmul_rb_pad.rs"
harness = false

# M3.3d: honest effective-TFLOPS bench for matmul_msg_coopmat.axc (AT-1750).
# Bench ID: dispatch_resident_matmul_msg_coopmat (distinct from AT-1711/AT-1730 ids).
[[bench]]
name = "resident_matmul_msg"
path = "benches/resident_matmul_msg.rs"
harness = false

# M3.9: honest effective-TFLOPS bench for the multi-subgroup warptile (K=4) vs the K=2
# opponent vs single-subgroup RB (AT-2306/2307). Bench ID: dispatch_resident_matmul_warptile.
[[bench]]
name = "resident_matmul_warptile"
path = "benches/resident_matmul_warptile.rs"
harness = false

# M3.4: AXIOM-side A/B measurement bench for the llama.cpp Vulkan Q4_K_M head-to-head
# (the DESIGN §5 kill-criterion run). Bench ID: dispatch_q4km_ab. GPU-gated.
[[bench]]
name = "dispatch_q4km_ab"
path = "benches/dispatch_q4km_ab.rs"
harness = false

# M3.5: honest effective-TFLOPS bench for the FUSED Q4_K_M register-blocked coopmat matmul
# (AT-1772) + the SAME-SHAPE A/B re-run line (AT-1774). Bench ID:
# dispatch_resident_q4km_matmul_rb. GPU-gated.
[[bench]]
name = "resident_q4km_matmul_rb"
path = "benches/resident_q4km_matmul_rb.rs"
harness = false

# M3.5b: honest effective-TFLOPS bench for the f32-ACCUMULATOR FUSED Q4_K_M register-blocked
# coopmat matmul (AT-1783) + the now-VALID SAME-SHAPE A/B re-run line (AT-1784). Bench ID:
# dispatch_resident_q4km_matmul_rb_f32acc. GPU-gated.
[[bench]]
name = "resident_q4km_matmul_rb_f32acc"
path = "benches/resident_q4km_matmul_rb_f32acc.rs"
harness = false

# M3.6: honest effective-TFLOPS bench for the DEQUANT-SCALE-CACHED f32-ACCUMULATOR FUSED
# Q4_K_M register-blocked coopmat matmul (AT-1804) + the SAME-SHAPE A/B line emitting
# AXC_Q4KM_AB_F32ACC_CACHED (AT-1805). Sibling of resident_q4km_matmul_rb_f32acc; same honesty
# contract (combined metric drives VALID/INVALID). Bench ID:
# dispatch_resident_q4km_matmul_rb_f32acc_cached. GPU-gated.
[[bench]]
name = "resident_q4km_matmul_rb_f32acc_cached"
path = "benches/resident_q4km_matmul_rb_f32acc_cached.rs"
harness = false

# M3.13 PRONG A: resident TFLOPS for the LIVE-RANGE-TIGHTENED kernel vs the M3.6 leader (AT-2802/2804),
# emitting AXC_Q4KM_TIGHTLIVE (scripts/m34_llamacpp_ab.sh --tightlive). Prints the tightlive/leader
# ratio at 768^3 + A/B, the >=1.15x gate verdict (NEVER loosened), and the per-variant A-staging
# temp-count proxy; ARMED DOUBLE honest-negative (proxy-no-drop OR proxy-drop-but-TFLOPS-flat, the
# LIKELY base case). Bench ID: dispatch_resident_q4km_matmul_rb_f32acc_cached_tightlive. GPU-gated.
[[bench]]
name = "resident_q4km_matmul_rb_f32acc_cached_tightlive"
path = "benches/resident_q4km_matmul_rb_f32acc_cached_tightlive.rs"
harness = false

# M3.11a: honest A/B + cube TFLOPS bench for the dequant-index STRENGTH-REDUCED Q4_K_M scale-cached
# f32-accumulator RB coopmat matmul (AT-2602/2604) vs the M3.6 leader, emitting
# AXC_Q4KM_AB_F32ACC_CACHED_SR (scripts/m34_llamacpp_ab.sh --sr). >= 1.15x M3.6 (>= 49.3 TFLOPS) gate,
# printed + checked, never asserted-loose; ARMED honest-negative (ALU-down-but-TFLOPS-flat =>
# latency-hidden under HMMA, the LIKELY base case). Bench ID:
# dispatch_resident_q4km_matmul_rb_f32acc_cached_sr. GPU-gated.
[[bench]]
name = "resident_q4km_matmul_rb_f32acc_cached_sr"
path = "benches/resident_q4km_matmul_rb_f32acc_cached_sr.rs"
harness = false

# M3.12: dequant front-end ABLATION DIAGNOSTIC — per-variant resident TFLOPS + the RE-ANCHORED
# triangulation (V-structure-probe is the PRIMARY denominator) + the register/temp-count proxy,
# emitting AXC_Q4KM_AB_ABLATE (scripts/m34_llamacpp_ab.sh --ablate). The variants are PROFILING
# INSTRUMENTS with WRONG OUTPUT BY DESIGN (no correctness gate); the deliverable is the PINPOINT of
# the dominant 1.77x dequant front-end tax (arithmetic vs structural). Bench ID:
# dispatch_resident_q4km_matmul_rb_f32acc_cached_ablate. GPU-gated.
[[bench]]
name = "resident_q4km_matmul_rb_f32acc_cached_ablate"
path = "benches/resident_q4km_matmul_rb_f32acc_cached_ablate.rs"
harness = false

# M3.10a (CONDITIONAL): honest A/B + cube TFLOPS bench for the BANK-PADDED Q4_K_M scale-cached
# f32-accumulator RB coopmat matmul (AT-2407) + the PAD sweep, emitting AXC_Q4KM_AB_F32ACC_CACHED_PAD
# (scripts/m34_llamacpp_ab.sh --pad). >= 1.15x M3.6 (>= 49.3 TFLOPS) AND combined <= 1e-3 gate,
# printed + checked, never asserted-loose; armed honest-negative. Bench ID:
# dispatch_resident_q4km_matmul_rb_f32acc_cached_pad. GPU-gated.
[[bench]]
name = "resident_q4km_matmul_rb_f32acc_cached_pad"
path = "benches/resident_q4km_matmul_rb_f32acc_cached_pad.rs"
harness = false

# M3.7: honest effective-TFLOPS bench for the DOUBLE-BUFFERED (software-pipelined) scale-cached
# f32-ACCUMULATOR FUSED Q4_K_M register-blocked coopmat matmul (AT-1904) + the SAME-SHAPE A/B line
# emitting AXC_Q4KM_AB_F32ACC_DB (AT-1905). Sibling of resident_q4km_matmul_rb_f32acc_cached; same
# honesty contract (combined metric drives VALID/INVALID); reports shared_memory_bytes for the
# occupancy honest-negative. Bench ID: dispatch_resident_q4km_matmul_rb_f32acc_db. GPU-gated.
[[bench]]
name = "resident_q4km_matmul_rb_f32acc_db"
path = "benches/resident_q4km_matmul_rb_f32acc_db.rs"
harness = false

# M3.8: honest effective-TFLOPS bench for BOTH LARGER-REGISTER-TILE variants (4x2 = 8 accumulators
# / 4x4 = 16 accumulators) of the M3.6 scale-cached f32-accumulator fused Q4_K_M coopmat matmul
# (AT-2004) + the SAME-SHAPE A/B lines AXC_Q4KM_AB_F32ACC_BIGRB_4X2 / _4X4 (AT-2005). Clone of
# resident_q4km_matmul_rb_f32acc_cached; same honesty contract (combined metric drives
# VALID/INVALID); NR-2 per-variant grid guard; prints the winner + the >=1.15x / >=49.3 TFLOPS
# gate + shared_memory_bytes. Bench ID: dispatch_resident_q4km_matmul_rb_f32acc_cached_bigrb. GPU-gated.
[[bench]]
name = "resident_q4km_matmul_rb_f32acc_cached_bigrb"
path = "benches/resident_q4km_matmul_rb_f32acc_cached_bigrb.rs"
harness = false

# M3.2c-perf: AT-2204 coopmat-vs-scalar FlashAttention wall-time A/B (seq=2048, head_dim=64).
# Bench ID: dispatch_resident_flash_attention. STRETCH 3x gate with honest-negative clause.
[[bench]]
name = "resident_flash_attention"
path = "benches/resident_flash_attention.rs"
harness = false


[features]
# M2.2 AT-714: fault-injection feature for regression-gate CI validation.
# When enabled, cpu_saxpy_reference adds a 100M-iteration accumulator loop
# that artificially slows execution by ~10000x, proving the regression gate
# correctly detects slowdowns. NEVER enabled in default builds.
bench_regression_fixture_slowdown = []

[dependencies]
axc-lexer    = { path = "../axc-lexer" }
axc-parser   = { path = "../axc-parser" }
axc-hir      = { path = "../axc-hir" }
axc-codegen  = { path = "../axc-codegen" }
axc-optimize = { path = "../axc-optimize" }
axc-runtime  = { path = "../axc-runtime" }
clap = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
xxhash-rust = { workspace = true }
# M2.4: Deterministic seeded input generation for bench_variant.
rand = { workspace = true }
# M2.4: POSIX flock(LOCK_EX) for atomic history file append.
libc = "0.2"
# M2.4: In-process SPIR-V validation for compile_variant + bench_variant.
spirv-tools = "0.13"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# M2.4: SPIR-V capability name mapping.
spirv = { workspace = true }
# M3.5b/M4.1p2: half — f16 rounding for the pub q4km_oracle module (the f32-accumulator
# Q4_K_M reference). Promoted from [dev-dependencies] so the oracle is callable from the
# axc-py PyO3 bridge (single source of truth for the AT-2103 frozen-1e-3 gate).
half = "2"

[dev-dependencies]
rspirv = { workspace = true }
spirv = { workspace = true }
# M2.2: Criterion bench framework (cargo_bench_support only — no HTML reports dep).
criterion = { workspace = true }
# M2.2: Serde for baselines.json and candidate-baselines.json serialization.
# M2.4: Temp file creation for history append tests.
tempfile = { workspace = true }
