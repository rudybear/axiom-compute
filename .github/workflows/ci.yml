name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # AXC_REQUIRE_SPIRV_VAL is set at JOB level so it is visible to both
    # the spirv-val presence-gate step AND the cargo-test step without
    # duplicating the env block on each step.  Setting it at workflow level
    # would leak to future jobs where it is not meaningful; job-level is
    # the correct scope (per spec §7.2 NEW-4 resolution).
    env:
      AXC_REQUIRE_SPIRV_VAL: "1"
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      AXC_ENABLE_GPU_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install SPIRV-Tools
        run: sudo apt-get update && sudo apt-get install -y spirv-tools
      - name: Presence-gate spirv-val
        # Fail loudly if SPIRV-Tools installation didn't produce spirv-val
        run: spirv-val --version
      - name: Install Vulkan + Lavapipe
        run: sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan-dev
      - name: Probe Vulkan with Lavapipe
        run: vulkaninfo --summary || echo 'vulkaninfo probe non-fatal'
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      - name: Probe Mesa driver version (non-fatal)
        # EB.1-prep fold-in (M3.23 discovery): Mesa 25.2.8 is KNOWN-BAD for the
        # resident shared-mem dispatch path (SIGSEGV/heap corruption). We do not
        # pin ubuntu-latest's Mesa here (hosted runner, apt mirror not ours to
        # control) — this just surfaces the version in the log instead of a
        # mystery segfault. See docs/EB1_RUNNER_SETUP.md §Mesa pin.
        run: vulkaninfo | grep driverInfo || echo 'mesa-version probe non-fatal'
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      - name: Clippy
        # M4.1: --workspace includes axc-py (cdylib, extension-module) which builds on
        # Lavapipe CI without libpython. Clippy on the whole workspace stays useful.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # default-members EXCLUDES axc-py so the Lavapipe gate never depends on
        # libpython / maturin (M4.1 R-5). The PyTorch-interop tests run in the separate
        # self-hosted NVIDIA job below.
        run: cargo test && cargo test -- --ignored

  # M2.2: Regression gate — runs cpu_reference benches and checks for >15% slowdown.
  # Benches are compiled in release mode to match the profile used for baselines.json.
  # AXC_BLESS_BASELINES is NOT set (AT-714b discipline: never auto-bless in CI).
  bench-regression:
    runs-on: ubuntu-latest
    env:
      AXC_ENABLE_BENCH_REGRESSION: "1"
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan + Lavapipe
        run: sudo apt-get install -y mesa-vulkan-drivers libvulkan-dev
      - name: Run regression gate (release mode, no feature flag)
        # AXC_BLESS_BASELINES must NOT be set (AT-714b).
        # --release ensures timing matches the baselines.json generation profile.
        run: >
          cargo test --release -p axc-driver --test bench_regression
          -- --nocapture
        env:
          # Explicitly unset to guard against accidental blessing in CI.
          AXC_BLESS_BASELINES: ""

  # M2.2 AT-714b: Fault-injection CI job — verifies the regression gate correctly
  # detects a >15% slowdown when bench_regression_fixture_slowdown is enabled.
  # This MUST be a SEPARATE job from bench-regression (AT-714b).
  # Neither job sets AXC_BLESS_BASELINES.
  bench-regression-fault-injection:
    runs-on: ubuntu-latest
    env:
      AXC_ENABLE_BENCH_REGRESSION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run fault-injection regression gate (must exit 1)
        # Enables the artificial slowdown feature.  The test MUST fail (exit 1).
        # We invert with `!` so the job succeeds when cargo test fails (as expected).
        # AXC_BLESS_BASELINES must NOT be set (AT-714b).
        run: >
          ! cargo test --release
          --features bench_regression_fixture_slowdown
          -p axc-driver --test bench_regression
          -- bench_regression_detects_over_threshold_slowdown --nocapture
        env:
          AXC_BLESS_BASELINES: ""

  # M4.1: PyTorch CUDA↔Vulkan zero-copy interop tests. SELF-HOSTED NVIDIA only —
  # SKIPPED on the Lavapipe software-GPU CI (no CUDA, no NVIDIA Vulkan ICD). Mirrors
  # the M3.x #[ignore] GPU-test gating. continue-on-error keeps the PR mergeable while
  # the self-hosted runner fleet is provisioned; the cargo gate above stays blocking.
  #
  # EB.1-prep §2.3 hardening: this job is a self-hosted job on a `pull_request`
  # trigger and was, before this change, the single LIVE fork-PR hole in the repo
  # (no same-repo guard, no permissions pin, no timeout — a fork PR's
  # `working-directory: py` build + `maturin develop --release` + `pytest` would
  # execute attacker-controlled code on this maintainer's real NVIDIA GPU box).
  # The three additions below close it; continue-on-error (PR-mergeability
  # posture) and the AXC_ENABLE_GPU_TESTS/VK_DRIVER_FILES/steps are unchanged.
  pytorch-interop:
    runs-on: [self-hosted, nvidia, cuda]
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    env:
      AXC_ENABLE_GPU_TESTS: "1"
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/nvidia_icd.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin
        run: pip install --upgrade "maturin>=1.7,<2"
      - name: Build + install the axiom_compute wheel
        working-directory: py
        run: maturin develop --release
      - name: Run zero-copy interop tests (AT-2100..2110)
        working-directory: py
        run: python -m pytest tests/ -v

  # EB.1-prep §6.4: schema-level lint of every workflow file (bad `runs-on`,
  # unknown keys, expression errors). Supply-chain-pinned: the actionlint
  # binary is downloaded by an EXACT version tag and SHA-256-verified against a
  # checksum committed in this file BEFORE it is executed — no unpinned network
  # binary fetch. actionlint is never load-bearing for the security ATs; the
  # authoritative structural/security coverage is the saphyr-backed
  # eb1_workflow_ci.rs (unconditional parse, panics on failure, never a silent
  # skip). Custom self-hosted labels (nvidia/cuda/amd-rdna3/intel-arc) are
  # declared in .github/actionlint.yaml so the schema check doesn't flag them.
  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@v4
      - name: Download + checksum-verify actionlint
        run: |
          set -euo pipefail
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o actionlint.tar.gz "${URL}"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
      - name: Run actionlint
        # PESS-1 must-fix: GitHub Actions honors BOTH .yml and .yaml workflow
        # file extensions equally, so the file selector must widen to match —
        # a `.yaml` workflow would otherwise bypass actionlint entirely
        # (proven by scratch injection during code review). Invoked with NO
        # path args so actionlint auto-discovers every file in
        # .github/workflows regardless of extension (.yml AND .yaml), instead
        # of a `*.yml`-only glob that a literal, no-match `*.yaml` pattern
        # would otherwise pass through unexpanded and fail on. Mirrors the
        # all_workflow_files() widening in eb1_workflow_ci.rs (§2.4/§6.3).
        run: ./actionlint
